<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-devops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d1a" />
      <stop offset="50%" stop-color="#091b33" />
      <stop offset="100%" stop-color="#030914" />
    </linearGradient>

    <radialGradient id="glow-devops-sky" cx="35%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030914" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-devops-emerald" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030914" stop-opacity="0" />
    </radialGradient>

    <!-- Card & Element Gradients -->
    <linearGradient id="devops-card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f38" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#071324" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="devops-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="infinity-tube-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="infinity-tube-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="k8s-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="docker-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow-devops" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intense-glow-devops" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow-devops">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bg-grad-devops)" />
  <rect width="1600" height="900" fill="url(#glow-devops-sky)" />
  <rect width="1600" height="900" fill="url(#glow-devops-emerald)" />

  <!-- Isometric Hexagon Server Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <path d="M 200 300 L 250 270 L 300 300 L 300 360 L 250 390 L 200 360 Z" />
    <path d="M 300 360 L 350 330 L 400 360 L 400 420 L 350 450 L 300 420 Z" />
    <path d="M 400 420 L 450 390 L 500 420 L 500 480 L 450 510 L 400 480 Z" />
    <path d="M 1200 240 L 1250 210 L 1300 240 L 1300 300 L 1250 330 L 1200 300 Z" />
    <path d="M 1300 300 L 1350 270 L 1400 300 L 1400 360 L 1350 390 L 1300 360 Z" />
    <path d="M 1100 360 L 1150 330 L 1200 360 L 1200 420 L 1150 450 L 1100 420 Z" />
  </g>

  <!-- Left: DevOps Infinity Loop Pipeline Card -->
  <g transform="translate(130, 160)" filter="url(#shadow-devops)">
    <rect width="640" height="470" rx="20" fill="url(#devops-card-surface)" stroke="url(#devops-border)" stroke-width="2" />
    
    <!-- Titlebar -->
    <rect width="640" height="50" rx="20" fill="#0b172a" fill-opacity="0.9" />
    <rect y="40" width="640" height="10" fill="#0b172a" fill-opacity="0.9" />
    <line x1="0" y1="50" x2="640" y2="50" stroke="#1e293b" stroke-width="1" />
    
    <circle cx="30" cy="25" r="6" fill="#38bdf8" />
    <circle cx="50" cy="25" r="6" fill="#06b6d4" />
    <circle cx="70" cy="25" r="6" fill="#10b981" />
    <text x="95" y="31" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f0f9ff">Continuous Integration &amp; Continuous Deployment</text>
    
    <rect x="475" y="12" width="145" height="26" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.5" />
    <text x="495" y="29" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#bae6fd">CI/CD Pipeline: Active</text>

    <!-- The 3D Infinity Loop Vector Structure -->
    <g transform="translate(320, 240)">
      <!-- Outer Glow Track -->
      <path d="M -140 0 C -140 -80 -40 -80 0 0 C 40 80 140 80 140 0 C 140 -80 40 -80 0 0 C -40 80 -140 80 -140 0 Z" 
            fill="none" stroke="url(#infinity-tube-1)" stroke-width="18" stroke-linecap="round" opacity="0.3" filter="url(#soft-glow-devops)" />
      
      <!-- Main Shiny Track -->
      <path d="M -140 0 C -140 -80 -40 -80 0 0 C 40 80 140 80 140 0 C 140 -80 40 -80 0 0 C -40 80 -140 80 -140 0 Z" 
            fill="none" stroke="url(#infinity-tube-2)" stroke-width="10" stroke-linecap="round" />

      <!-- Center Intersecting Core -->
      <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#soft-glow-devops)" />

      <!-- Pulse Flow Particles -->
      <circle cx="-140" cy="0" r="6" fill="#38bdf8" filter="url(#soft-glow-devops)" />
      <circle cx="140" cy="0" r="6" fill="#34d399" filter="url(#soft-glow-devops)" />
      <circle cx="-70" cy="-45" r="5" fill="#bae6fd" />
      <circle cx="70" cy="45" r="5" fill="#a7f3d0" />

      <!-- Stage Labels -->
      <!-- Left Loop (Dev) -->
      <g font-family="system-ui, sans-serif" font-size="12" font-weight="800">
        <text x="-165" y="-60" fill="#38bdf8">PLAN</text>
        <text x="-210" y="5" fill="#38bdf8">CODE</text>
        <text x="-165" y="75" fill="#38bdf8">BUILD</text>
        <text x="-70" y="75" fill="#06b6d4">TEST</text>

        <!-- Right Loop (Ops) -->
        <text x="50" y="-60" fill="#06b6d4">RELEASE</text>
        <text x="145" y="-60" fill="#34d399">DEPLOY</text>
        <text x="160" y="5" fill="#34d399">OPERATE</text>
        <text x="120" y="75" fill="#10b981">MONITOR</text>
      </g>
    </g>

    <!-- Terminal Output Status Box Inside Window -->
    <g transform="translate(35, 360)">
      <rect width="570" height="85" rx="10" fill="#060c18" stroke="#1e293b" stroke-width="1" />
      <g font-family="monospace" font-size="12" font-weight="600">
        <text x="15" y="25" fill="#10b981">✓ [GitHub Actions] 18 tests passed in 4.2s</text>
        <text x="15" y="50" fill="#38bdf8">✓ [Docker Build] image sha256:4f8e91b tagged as latest</text>
        <text x="15" y="72" fill="#facc15">🚀 [K8s Rolling Update] 12/12 pods healthy across us-east-1</text>
      </g>
    </g>
  </g>

  <!-- Connective Cloud Pipeline Bus -->
  <g filter="url(#soft-glow-devops)">
    <path d="M 770 340 H 870 L 920 280 H 1010" stroke="url(#infinity-tube-1)" stroke-width="4" fill="none" />
    <path d="M 770 450 H 870 L 920 520 H 1010" stroke="url(#infinity-tube-2)" stroke-width="4" fill="none" />
    <circle cx="870" cy="340" r="6" fill="#38bdf8" />
    <circle cx="870" cy="450" r="6" fill="#10b981" />
  </g>

  <!-- Right: Kubernetes Cluster & Terraform Infrastructure -->
  
  <!-- Block 1: Kubernetes Cluster Orchestration -->
  <g transform="translate(1030, 160)" filter="url(#shadow-devops)">
    <rect width="420" height="230" rx="20" fill="url(#devops-card-surface)" stroke="#38bdf8" stroke-width="1.8" />
    
    <!-- Kubernetes Helm Ship Wheel Logo Emblem -->
    <g transform="translate(55, 65)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#soft-glow-devops)" />
      <circle cx="0" cy="0" r="14" fill="#0284c7" />
      <!-- 7 Spokes -->
      <line x1="0" y1="-32" x2="0" y2="-45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="-16" x2="39" y2="-22" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <line x1="28" y1="16" x2="39" y2="22" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="32" x2="0" y2="45" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <line x1="-28" y1="16" x2="-39" y2="22" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <line x1="-28" y1="-16" x2="-39" y2="-22" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    </g>

    <text x="115" y="55" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#f0f9ff">Kubernetes (K8s)</text>
    <text x="115" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Multi-Region Container Orchestration</text>

    <!-- Microservice Pod Grid Visualizer (3 Pod Clusters) -->
    <g transform="translate(25, 115)">
      <rect x="0" y="0" width="115" height="48" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" />
      <circle cx="16" cy="24" r="5" fill="#14b8a6" />
      <text x="28" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ccfbf1">API Gateway</text>
      <text x="28" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#5eead4">3/3 Replicas</text>

      <rect x="125" y="0" width="115" height="48" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="141" cy="24" r="5" fill="#38bdf8" />
      <text x="153" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe">Auth Service</text>
      <text x="153" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#7dd3fc">5/5 Replicas</text>

      <rect x="250" y="0" width="120" height="48" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="266" cy="24" r="5" fill="#818cf8" />
      <text x="278" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e0e7ff">Worker Queue</text>
      <text x="278" y="38" font-family="monospace" font-size="10" font-weight="600" fill="#a5b4fc">8/8 Replicas</text>
    </g>

    <!-- Cluster Specs Pill -->
    <rect x="25" y="180" width="160" height="26" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="35" y="197" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">EKS Cluster 1.30</text>

    <rect x="200" y="180" width="170" height="26" rx="6" fill="#065f46" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.4" />
    <text x="212" y="197" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Auto-Healing HPA</text>
  </g>

  <!-- Block 2: Terraform IaC & Docker Cloud Containers -->
  <g transform="translate(1030, 420)" filter="url(#shadow-devops)">
    <rect width="420" height="210" rx="20" fill="url(#devops-card-surface)" stroke="#10b981" stroke-width="1.8" />
    
    <text x="25" y="40" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#f0fdf4">Terraform IaC &amp; Docker</text>
    <text x="25" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#86efac">Declarative Cloud Multi-Zone Setup</text>

    <!-- Terraform Command Output Widget -->
    <g transform="translate(25, 80)">
      <rect width="370" height="65" rx="8" fill="#030c14" stroke="#059669" stroke-width="1" />
      <g font-family="monospace" font-size="11" font-weight="600">
        <text x="15" y="25" fill="#34d399">$ terraform apply -auto-approve</text>
        <text x="15" y="48" fill="#94a3b8">Plan: 42 to add, 0 to change, 0 to destroy.</text>
      </g>
    </g>

    <!-- Tag Pills -->
    <rect x="25" y="165" width="85" height="24" rx="6" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.5" />
    <text x="37" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">AWS VPC</text>

    <rect x="120" y="165" width="85" height="24" rx="6" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-opacity="0.5" />
    <text x="135" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Ansible</text>

    <rect x="215" y="165" width="120" height="24" rx="6" fill="#4338ca" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.5" />
    <text x="228" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">GitHub Actions</text>
  </g>

  <!-- Floating DevOps Tech Badges -->
  <g transform="translate(680, 110)" filter="url(#shadow-devops)">
    <rect width="140" height="38" rx="10" fill="#0b172a" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#0284c7" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">99.99% Uptime</text>
  </g>

  <g transform="translate(860, 670)" filter="url(#shadow-devops)">
    <rect width="140" height="38" rx="10" fill="#0b172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#10b981" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7">Zero Downtime</text>
  </g>

  <g transform="translate(60, 660)" filter="url(#shadow-devops)">
    <rect width="180" height="42" rx="12" fill="#0b172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#38bdf8">☸ Cloud Architect</text>
  </g>

  <!-- Glowing Corner Lights -->
  <circle cx="1500" cy="100" r="180" fill="#0284c7" opacity="0.1" filter="url(#intense-glow-devops)" />
  <circle cx="100" cy="800" r="180" fill="#10b981" opacity="0.1" filter="url(#intense-glow-devops)" />
</svg>
