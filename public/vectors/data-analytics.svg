<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-bi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06061a" />
      <stop offset="50%" stop-color="#0d0f2b" />
      <stop offset="100%" stop-color="#040414" />
    </linearGradient>

    <radialGradient id="glow-bi-indigo" cx="35%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#040414" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-bi-cyan" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#040414" stop-opacity="0" />
    </radialGradient>

    <!-- Card & Element Gradients -->
    <linearGradient id="bi-card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121436" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#080a21" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="bi-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Chart Gradients -->
    <linearGradient id="bar-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="bar-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="bar-grad-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="bar-grad-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <linearGradient id="spline-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow-bi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intense-glow-bi" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow-bi">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bg-grad-bi)" />
  <rect width="1600" height="900" fill="url(#glow-bi-indigo)" />
  <rect width="1600" height="900" fill="url(#glow-bi-cyan)" />

  <!-- Isometric Business Chart Grid -->
  <g opacity="0.14" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4">
    <line x1="0" y1="200" x2="1600" y2="200" />
    <line x1="0" y1="350" x2="1600" y2="350" />
    <line x1="0" y1="500" x2="1600" y2="500" />
    <line x1="0" y1="650" x2="1600" y2="650" />
    <line x1="0" y1="800" x2="1600" y2="800" />

    <line x1="300" y1="0" x2="300" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="900" y1="0" x2="900" y2="900" />
    <line x1="1200" y1="0" x2="1200" y2="900" />
  </g>

  <!-- Left: Executive 3D Analytics Cockpit & Growth Spline Card -->
  <g transform="translate(130, 160)" filter="url(#shadow-bi)">
    <rect width="640" height="470" rx="20" fill="url(#bi-card-surface)" stroke="url(#bi-border)" stroke-width="2" />
    
    <!-- Titlebar -->
    <rect width="640" height="50" rx="20" fill="#0f112e" fill-opacity="0.9" />
    <rect y="40" width="640" height="10" fill="#0f112e" fill-opacity="0.9" />
    <line x1="0" y1="50" x2="640" y2="50" stroke="#1f245c" stroke-width="1" />
    
    <circle cx="30" cy="25" r="6" fill="#818cf8" />
    <circle cx="50" cy="25" r="6" fill="#c084fc" />
    <circle cx="70" cy="25" r="6" fill="#38bdf8" />
    <text x="95" y="31" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e0e7ff">Business Intelligence &amp; Multi-Tier Financial Analytics</text>
    
    <rect x="475" y="12" width="145" height="26" rx="6" fill="#3730a3" fill-opacity="0.4" stroke="#818cf8" stroke-opacity="0.5" />
    <text x="495" y="29" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">Live Power BI Feed</text>

    <!-- 3D Bar Chart Visualizer -->
    <g transform="translate(60, 290)">
      <!-- Chart Baseline -->
      <line x1="0" y1="0" x2="520" y2="0" stroke="#334155" stroke-width="2" />

      <!-- Bar 1 -->
      <rect x="20" y="-80" width="45" height="80" rx="6" fill="url(#bar-grad-1)" filter="url(#soft-glow-bi)" />
      <text x="42" y="-90" font-family="monospace" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle">Q1</text>
      <text x="42" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">₹6.2M</text>

      <!-- Bar 2 -->
      <rect x="95" y="-130" width="45" height="130" rx="6" fill="url(#bar-grad-2)" filter="url(#soft-glow-bi)" />
      <text x="117" y="-140" font-family="monospace" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">Q2</text>
      <text x="117" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">₹10.5M</text>

      <!-- Bar 3 -->
      <rect x="170" y="-170" width="45" height="170" rx="6" fill="url(#bar-grad-3)" filter="url(#soft-glow-bi)" />
      <text x="192" y="-180" font-family="monospace" font-size="11" font-weight="700" fill="#d8b4fe" text-anchor="middle">Q3</text>
      <text x="192" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">₹14.8M</text>

      <!-- Bar 4 -->
      <rect x="245" y="-210" width="45" height="210" rx="6" fill="url(#bar-grad-4)" filter="url(#soft-glow-bi)" />
      <text x="267" y="-220" font-family="monospace" font-size="11" font-weight="700" fill="#fda4af" text-anchor="middle">Q4</text>
      <text x="267" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">₹19.4M</text>

      <!-- Bar 5: Peak Year Forecast -->
      <rect x="320" y="-260" width="45" height="260" rx="6" fill="url(#bar-grad-5)" filter="url(#soft-glow-bi)" />
      <text x="342" y="-270" font-family="monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">YTD</text>
      <text x="342" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">₹24.0M</text>

      <!-- Trend Area Spline Overlay Line -->
      <path d="M 42 -80 Q 117 -150 192 -170 T 267 -220 T 342 -260 T 480 -300" 
            fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round" filter="url(#soft-glow-bi)" />
      <circle cx="480" cy="-300" r="6" fill="#facc15" filter="url(#soft-glow-bi)" />
      <rect x="420" y="-340" width="105" height="26" rx="6" fill="#1e1b4b" stroke="#facc15" stroke-width="1.2" />
      <text x="472" y="-323" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#facc15" text-anchor="middle">+284% CAGR</text>
    </g>

    <!-- Bottom SQL Query Stream Box -->
    <g transform="translate(35, 360)">
      <rect width="570" height="85" rx="10" fill="#08091c" stroke="#1f245c" stroke-width="1" />
      <g font-family="monospace" font-size="12" font-weight="600">
        <text x="15" y="25" fill="#c084fc">SELECT department, AVG(ctc_lpa) AS avg_offer, COUNT(*) AS placed</text>
        <text x="15" y="50" fill="#818cf8">FROM nyeras_graduates GROUP BY department HAVING placed &gt; 500;</text>
        <text x="15" y="72" fill="#34d399">✓ Query executed in 18ms across 1,500,000 BigQuery rows</text>
      </g>
    </g>
  </g>

  <!-- Connective Data Spline Bus -->
  <g filter="url(#soft-glow-bi)">
    <path d="M 770 340 H 870 L 920 280 H 1010" stroke="#818cf8" stroke-width="4" fill="none" />
    <path d="M 770 450 H 870 L 920 520 H 1010" stroke="#c084fc" stroke-width="4" fill="none" />
    <circle cx="870" cy="340" r="6" fill="#818cf8" />
    <circle cx="870" cy="450" r="6" fill="#c084fc" />
  </g>

  <!-- Right: Tableau & Power BI Analytical Widgets -->
  
  <!-- Block 1: Executive KPI Donut Gauge & Metrics -->
  <g transform="translate(1030, 160)" filter="url(#shadow-bi)">
    <rect width="420" height="230" rx="20" fill="url(#bi-card-surface)" stroke="#818cf8" stroke-width="1.8" />
    
    <text x="25" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#e0e7ff">Tableau &amp; Power BI Cockpit</text>
    <text x="25" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#a5b4fc">Interactive Executive Dashboard • Real-time Sync</text>

    <!-- KPI Donut Arc Visualizer -->
    <g transform="translate(85, 135)">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#1e1b4b" stroke-width="12" />
      <path d="M 0 -45 A 45 45 0 1 1 -42 16" fill="none" stroke="#818cf8" stroke-width="12" stroke-linecap="round" filter="url(#soft-glow-bi)" />
      <text x="0" y="5" font-family="monospace" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">94%</text>
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#a5b4fc" text-anchor="middle">TARGET</text>
    </g>

    <g transform="translate(180, 95)">
      <rect width="200" height="80" rx="10" fill="#0d0f2b" stroke="#312e81" stroke-width="1" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">Average Placement Package</text>
      <text x="15" y="52" font-family="monospace" font-size="20" font-weight="800" fill="#34d399">₹12.8 LPA</text>
      <text x="135" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">+160%</text>
    </g>

    <!-- Tags Row -->
    <rect x="25" y="180" width="95" height="26" rx="6" fill="#312e81" fill-opacity="0.4" stroke="#818cf8" stroke-opacity="0.5" />
    <text x="35" y="197" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">Power BI DAX</text>

    <rect x="130" y="180" width="85" height="26" rx="6" fill="#4c1d95" stroke="#a855f7" stroke-width="1" />
    <text x="142" y="197" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff">Tableau</text>

    <rect x="225" y="180" width="105" height="26" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1" />
    <text x="238" y="197" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Excel Advanced</text>
  </g>

  <!-- Block 2: SQL Data Warehouse & Metric Cubes -->
  <g transform="translate(1030, 420)" filter="url(#shadow-bi)">
    <rect width="420" height="210" rx="20" fill="url(#bi-card-surface)" stroke="#c084fc" stroke-width="1.8" />
    
    <text x="25" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#e0e7ff">SQL Server &amp; Data Warehousing</text>
    <text x="25" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#d8b4fe">Star Schema • Window Functions • Data Cleaning</text>

    <!-- Query Telemetry -->
    <g transform="translate(25, 80)">
      <rect width="370" height="65" rx="8" fill="#0a0c24" stroke="#4c1d95" stroke-width="1" />
      <g font-family="monospace" font-size="11" font-weight="600">
        <text x="15" y="25" fill="#c084fc">ETL Pipeline: Raw ERP Tables -&gt; Star Schema Fact</text>
        <text x="15" y="48" fill="#34d399">✓ 100% Automated Refresh via Snowflake &amp; SSIS</text>
      </g>
    </g>

    <!-- Tags Row -->
    <rect x="25" y="165" width="95" height="24" rx="6" fill="#312e81" fill-opacity="0.4" stroke="#818cf8" stroke-opacity="0.5" />
    <text x="37" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe">Snowflake</text>

    <rect x="130" y="165" width="85" height="24" rx="6" fill="#581c87" fill-opacity="0.4" stroke="#c084fc" stroke-opacity="0.5" />
    <text x="145" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f5d0fe">T-SQL</text>

    <rect x="225" y="165" width="125" height="24" rx="6" fill="#134e4a" fill-opacity="0.4" stroke="#2dd4bf" stroke-opacity="0.5" />
    <text x="238" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#99f6e4">Business Analyst</text>
  </g>

  <!-- Floating BI Badges -->
  <g transform="translate(680, 110)" filter="url(#shadow-bi)">
    <rect width="140" height="38" rx="10" fill="#0f112e" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#818cf8" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">99.4% Accuracy</text>
  </g>

  <g transform="translate(860, 670)" filter="url(#shadow-bi)">
    <rect width="140" height="38" rx="10" fill="#0f112e" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#c084fc" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#e9d5ff">Executive BI</text>
  </g>

  <g transform="translate(60, 660)" filter="url(#shadow-bi)">
    <rect width="180" height="42" rx="12" fill="#0f112e" stroke="#818cf8" stroke-width="1.5" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#818cf8">📊 Data Analytics</text>
  </g>

  <!-- Glowing Corner Lights -->
  <circle cx="1500" cy="100" r="180" fill="#6366f1" opacity="0.1" filter="url(#intense-glow-bi)" />
  <circle cx="100" cy="800" r="180" fill="#c084fc" opacity="0.1" filter="url(#intense-glow-bi)" />
</svg>
