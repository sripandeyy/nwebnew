<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-vlsi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120902" />
      <stop offset="50%" stop-color="#241304" />
      <stop offset="100%" stop-color="#0d0601" />
    </linearGradient>

    <radialGradient id="glow-vlsi-amber" cx="35%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0d0601" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-vlsi-orange" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0d0601" stop-opacity="0" />
    </radialGradient>

    <!-- Card & Element Gradients -->
    <linearGradient id="vlsi-card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1608" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#140a02" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="vlsi-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="chip-die-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>

    <linearGradient id="gold-trace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow-vlsi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intense-glow-vlsi" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow-vlsi">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bg-grad-vlsi)" />
  <rect width="1600" height="900" fill="url(#glow-vlsi-amber)" />
  <rect width="1600" height="900" fill="url(#glow-vlsi-orange)" />

  <!-- PCB Copper Trace Grid Overlay -->
  <g opacity="0.18" stroke="#f59e0b" stroke-width="1.5" fill="none">
    <path d="M 60 120 H 220 L 280 180 V 320 L 360 400 H 600" />
    <circle cx="60" cy="120" r="4" fill="#fbbf24" />
    <circle cx="600" cy="400" r="4" fill="#fbbf24" />

    <path d="M 1540 180 H 1380 L 1320 240 V 360 L 1240 440 H 1050" />
    <circle cx="1540" cy="180" r="4" fill="#f97316" />
    <circle cx="1050" cy="440" r="4" fill="#f97316" />

    <path d="M 750 780 V 700 L 820 630 H 980" />
    <circle cx="750" cy="780" r="4" fill="#f59e0b" />
    <circle cx="980" cy="630" r="4" fill="#f59e0b" />
  </g>

  <!-- Left: Silicon Microprocessor Die Architecture Card -->
  <g transform="translate(130, 160)" filter="url(#shadow-vlsi)">
    <rect width="640" height="470" rx="20" fill="url(#vlsi-card-surface)" stroke="url(#vlsi-border)" stroke-width="2" />
    
    <!-- Titlebar -->
    <rect width="640" height="50" rx="20" fill="#201004" fill-opacity="0.9" />
    <rect y="40" width="640" height="10" fill="#201004" fill-opacity="0.9" />
    <line x1="0" y1="50" x2="640" y2="50" stroke="#451a03" stroke-width="1" />
    
    <circle cx="30" cy="25" r="6" fill="#f59e0b" />
    <circle cx="50" cy="25" r="6" fill="#fbbf24" />
    <circle cx="70" cy="25" r="6" fill="#ea580c" />
    <text x="95" y="31" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fef3c7">SoC Silicon Die &amp; RTL Verilog Architecture</text>
    
    <rect x="475" y="12" width="145" height="26" rx="6" fill="#78350f" fill-opacity="0.4" stroke="#fbbf24" stroke-opacity="0.5" />
    <text x="495" y="29" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a">RISC-V 64-Bit Core</text>

    <!-- 3D Silicon Microprocessor Die Illustration -->
    <g transform="translate(320, 235)">
      <!-- Exterior Silicon Carrier Substrate -->
      <rect x="-135" y="-135" width="270" height="270" rx="14" fill="url(#chip-die-grad)" stroke="#78350f" stroke-width="3" />
      
      <!-- Gold Wirebond Pads on perimeter (24 pads) -->
      <g fill="#fbbf24">
        <!-- Top row -->
        <rect x="-110" y="-128" width="16" height="8" rx="2" /><rect x="-80" y="-128" width="16" height="8" rx="2" /><rect x="-50" y="-128" width="16" height="8" rx="2" />
        <rect x="34" y="-128" width="16" height="8" rx="2" /><rect x="64" y="-128" width="16" height="8" rx="2" /><rect x="94" y="-128" width="16" height="8" rx="2" />
        <!-- Bottom row -->
        <rect x="-110" y="120" width="16" height="8" rx="2" /><rect x="-80" y="120" width="16" height="8" rx="2" /><rect x="-50" y="120" width="16" height="8" rx="2" />
        <rect x="34" y="120" width="16" height="8" rx="2" /><rect x="64" y="120" width="16" height="8" rx="2" /><rect x="94" y="120" width="16" height="8" rx="2" />
        <!-- Left row -->
        <rect x="-128" y="-110" width="8" height="16" rx="2" /><rect x="-128" y="-80" width="8" height="16" rx="2" /><rect x="-128" y="-50" width="8" height="16" rx="2" />
        <rect x="-128" y="34" width="8" height="16" rx="2" /><rect x="-128" y="64" width="8" height="16" rx="2" /><rect x="-128" y="94" width="8" height="16" rx="2" />
        <!-- Right row -->
        <rect x="120" y="-110" width="8" height="16" rx="2" /><rect x="120" y="-80" width="8" height="16" rx="2" /><rect x="120" y="-50" width="8" height="16" rx="2" />
        <rect x="120" y="34" width="8" height="16" rx="2" /><rect x="120" y="64" width="8" height="16" rx="2" /><rect x="120" y="94" width="8" height="16" rx="2" />
      </g>

      <!-- Internal Silicon Core Die -->
      <rect x="-95" y="-95" width="190" height="190" rx="8" fill="#140f0c" stroke="#f59e0b" stroke-width="2" filter="url(#soft-glow-vlsi)" />

      <!-- Core Modules Inside Die -->
      <!-- ALU & Execution Engine -->
      <rect x="-85" y="-85" width="80" height="80" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1.2" />
      <text x="-45" y="-50" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fde68a" text-anchor="middle">ALU</text>
      <text x="-45" y="-35" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">Execution</text>

      <!-- Control Unit & Register Files -->
      <rect x="5" y="-85" width="80" height="80" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1.2" />
      <text x="45" y="-50" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fde68a" text-anchor="middle">REGISTERS</text>
      <text x="45" y="-35" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#fbbf24" text-anchor="middle">32x 64-bit</text>

      <!-- L1 & L2 Cache SRAM Blocks -->
      <rect x="-85" y="5" width="170" height="80" rx="4" fill="#291407" stroke="#d97706" stroke-width="1.2" />
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fde68a" text-anchor="middle">L1/L2 SRAM CACHE</text>
      <text x="0" y="58" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f59e0b" text-anchor="middle">High-Bandwidth Bus • 64KB</text>
    </g>

    <!-- Bottom Verilog / Waveform Output Box -->
    <g transform="translate(35, 360)">
      <rect width="570" height="85" rx="10" fill="#0f0702" stroke="#78350f" stroke-width="1" />
      <g font-family="monospace" font-size="12" font-weight="600">
        <text x="15" y="25" fill="#fde68a">always @(posedge clk or negedge rst_n) begin</text>
        <text x="15" y="50" fill="#f59e0b">  if (!rst_n) state_q &lt;= IDLE; else state_q &lt;= next_state;</text>
        <text x="15" y="72" fill="#34d399">✓ ModelSim: Zero Setup/Hold Timing Violations @ 2.4 GHz</text>
      </g>
    </g>
  </g>

  <!-- Connective Copper Bus -->
  <g filter="url(#soft-glow-vlsi)">
    <path d="M 770 340 H 870 L 920 280 H 1010" stroke="url(#gold-trace)" stroke-width="4" fill="none" />
    <path d="M 770 450 H 870 L 920 520 H 1010" stroke="url(#gold-trace)" stroke-width="4" fill="none" />
    <circle cx="870" cy="340" r="6" fill="#fbbf24" />
    <circle cx="870" cy="450" r="6" fill="#f97316" />
  </g>

  <!-- Right: FPGA Design & Embedded Firmware Stack -->
  
  <!-- Block 1: FPGA RTL & Verilog Simulation -->
  <g transform="translate(1030, 160)" filter="url(#shadow-vlsi)">
    <rect width="420" height="230" rx="20" fill="url(#vlsi-card-surface)" stroke="#fbbf24" stroke-width="1.8" />
    
    <text x="25" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#fef3c7">FPGA &amp; RTL Verilog Design</text>
    <text x="25" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#fde68a">Xilinx Vivado • SystemVerilog • Timing Synthesis</text>

    <!-- FPGA Logic Block Cells Visualizer -->
    <g transform="translate(25, 80)">
      <rect width="175" height="70" rx="10" fill="#201004" stroke="#d97706" stroke-width="1.2" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Clock Frequency</text>
      <text x="15" y="52" font-family="monospace" font-size="16" font-weight="800" fill="#fde68a">2.4 GHz Core</text>

      <rect x="190" y="0" width="180" height="70" rx="10" fill="#201004" stroke="#ea580c" stroke-width="1.2" />
      <text x="205" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ea580c">Timing Slack (WNS)</text>
      <text x="205" y="52" font-family="monospace" font-size="16" font-weight="800" fill="#34d399">+0.24 ns (Pass)</text>
    </g>

    <!-- Tags Row -->
    <rect x="25" y="175" width="115" height="26" rx="6" fill="#78350f" fill-opacity="0.4" stroke="#fbbf24" stroke-opacity="0.5" />
    <text x="35" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a">SystemVerilog</text>

    <rect x="150" y="175" width="105" height="26" rx="6" fill="#7c2d12" stroke="#ea580c" stroke-width="1" />
    <text x="160" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fdba74">Xilinx Vivado</text>

    <rect x="265" y="175" width="95" height="26" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
    <text x="277" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a">ModelSim</text>
  </g>

  <!-- Block 2: Embedded Systems & ARM RTOS Firmware -->
  <g transform="translate(1030, 420)" filter="url(#shadow-vlsi)">
    <rect width="420" height="210" rx="20" fill="url(#vlsi-card-surface)" stroke="#ea580c" stroke-width="1.8" />
    
    <text x="25" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#fef3c7">Embedded Systems &amp; RTOS</text>
    <text x="25" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#fdba74">ARM Cortex-M • FreeRTOS • C/C++ Device Drivers</text>

    <!-- Embedded Board Telemetry -->
    <g transform="translate(25, 80)">
      <rect width="370" height="65" rx="8" fill="#140802" stroke="#7c2d12" stroke-width="1" />
      <g font-family="monospace" font-size="11" font-weight="600">
        <text x="15" y="25" fill="#fde68a">[RTOS] FreeRTOS Task Scheduler: 4 priority tasks running</text>
        <text x="15" y="48" fill="#34d399">✓ [I2C/SPI] Sensor bus sampling @ 100 kHz without frame drops</text>
      </g>
    </g>

    <!-- Tags Row -->
    <rect x="25" y="165" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.4" stroke="#fbbf24" stroke-opacity="0.5" />
    <text x="35" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a">ARM Cortex</text>

    <rect x="140" y="165" width="95" height="24" rx="6" fill="#7c2d12" fill-opacity="0.4" stroke="#ea580c" stroke-opacity="0.5" />
    <text x="152" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fdba74">FreeRTOS</text>

    <rect x="245" y="165" width="105" height="24" rx="6" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-opacity="0.5" />
    <text x="258" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a">Embedded C</text>
  </g>

  <!-- Floating Semiconductor Tech Badges -->
  <g transform="translate(680, 110)" filter="url(#shadow-vlsi)">
    <rect width="140" height="38" rx="10" fill="#201004" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#f59e0b" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">7nm FinFET</text>
  </g>

  <g transform="translate(860, 670)" filter="url(#shadow-vlsi)">
    <rect width="140" height="38" rx="10" fill="#201004" stroke="#ea580c" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#ea580c" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fdba74">Silicon Tapeout</text>
  </g>

  <g transform="translate(60, 660)" filter="url(#shadow-vlsi)">
    <rect width="180" height="42" rx="12" fill="#201004" stroke="#fbbf24" stroke-width="1.5" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fbbf24">⚡ VLSI &amp; FPGA</text>
  </g>

  <!-- Glowing Corner Lights -->
  <circle cx="1500" cy="100" r="180" fill="#f59e0b" opacity="0.1" filter="url(#intense-glow-vlsi)" />
  <circle cx="100" cy="800" r="180" fill="#ea580c" opacity="0.1" filter="url(#intense-glow-vlsi)" />
</svg>
