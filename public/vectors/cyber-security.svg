<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-sec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140d" />
      <stop offset="50%" stop-color="#06261b" />
      <stop offset="100%" stop-color="#010e09" />
    </linearGradient>

    <radialGradient id="glow-sec-emerald" cx="35%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#010e09" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-sec-cyan" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#010e09" stop-opacity="0" />
    </radialGradient>

    <!-- Card & Element Gradients -->
    <linearGradient id="sec-card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a1f" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#041610" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="sec-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="radar-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="soft-glow-sec" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intense-glow-sec" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow-sec">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bg-grad-sec)" />
  <rect width="1600" height="900" fill="url(#glow-sec-emerald)" />
  <rect width="1600" height="900" fill="url(#glow-sec-cyan)" />

  <!-- Binary Data Rain & Mesh Overlay -->
  <g opacity="0.1" font-family="monospace" font-size="12" fill="#34d399">
    <text x="80" y="80">10110010 01101001 01101110 01110011 01110000 01100101 01100011 01110100</text>
    <text x="80" y="110">01100011 01111001 01100010 01100101 01110010 00101101 01110011 01100101</text>
    <text x="80" y="140">01100011 01110101 01110010 01101001 01110100 01111001 00100000 01110011</text>
    <text x="980" y="80">01010011 01001111 01000011 00100000 01000001 01001110 01000001 01001100</text>
    <text x="980" y="110">01011001 01010011 01010100 00100000 01001100 01001111 01000111 01010011</text>
    <text x="980" y="140">01010011 01001001 01000101 01001101 00100000 01010011 01010000 01001100</text>
  </g>

  <!-- Left: SOC Shield & Cryptographic Core -->
  <g transform="translate(130, 160)" filter="url(#shadow-sec)">
    <rect width="640" height="470" rx="20" fill="url(#sec-card-surface)" stroke="url(#sec-border)" stroke-width="2" />
    
    <!-- Titlebar -->
    <rect width="640" height="50" rx="20" fill="#041a13" fill-opacity="0.9" />
    <rect y="40" width="640" height="10" fill="#041a13" fill-opacity="0.9" />
    <line x1="0" y1="50" x2="640" y2="50" stroke="#064e3b" stroke-width="1" />
    
    <circle cx="30" cy="25" r="6" fill="#10b981" />
    <circle cx="50" cy="25" r="6" fill="#34d399" />
    <circle cx="70" cy="25" r="6" fill="#06b6d4" />
    <text x="95" y="31" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ecfdf5">SOC Threat Intel &amp; Penetration Defense Shield</text>
    
    <rect x="475" y="12" width="145" height="26" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-opacity="0.5" />
    <text x="495" y="29" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Firewall: 100% Armed</text>

    <!-- 3D Cyber Shield Illustration -->
    <g transform="translate(320, 235)">
      <!-- Radar Sweeper Rings -->
      <circle cx="0" cy="0" r="140" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.4" />
      <circle cx="0" cy="0" r="100" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5" />
      <circle cx="0" cy="0" r="60" fill="none" stroke="#34d399" stroke-width="1" opacity="0.6" />

      <!-- Sweeping Radar Sector Cone -->
      <path d="M 0 0 L 120 -70 A 140 140 0 0 1 140 0 Z" fill="url(#radar-beam)" />

      <!-- Outer Shield Hull -->
      <path d="M 0 -85 L 75 -45 V 20 C 75 75 0 110 0 110 C 0 110 -75 75 -75 20 V -45 Z" 
            fill="#022c22" stroke="url(#shield-grad)" stroke-width="4.5" filter="url(#soft-glow-sec)" />

      <!-- Inner Shield Inset -->
      <path d="M 0 -70 L 60 -36 V 16 C 60 60 0 90 0 90 C 0 90 -60 60 -60 16 V -36 Z" 
            fill="#064e3b" fill-opacity="0.6" stroke="#34d399" stroke-width="2" />

      <!-- Center Lock Mechanism -->
      <rect x="-18" y="-5" width="36" height="30" rx="6" fill="#34d399" />
      <path d="M -12 -5 V -18 C -12 -24 12 -24 12 -18 V -5" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
      <circle cx="0" cy="8" r="4" fill="#022c22" />
      <path d="M 0 12 V 18" stroke="#022c22" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Bottom Incident Response Feed Box -->
    <g transform="translate(35, 360)">
      <rect width="570" height="85" rx="10" fill="#03160e" stroke="#064e3b" stroke-width="1" />
      <g font-family="monospace" font-size="12" font-weight="600">
        <text x="15" y="25" fill="#34d399">[SIEM] 0 Anomalies detected in last 24,000 ingress packets</text>
        <text x="15" y="50" fill="#22d3ee">[TLS 1.3] AES-256-GCM Handshake verified on 8 ports</text>
        <text x="15" y="72" fill="#a7f3d0">[SOC 2] Red Team Pentest Passed: 0 High Vulnerabilities</text>
      </g>
    </g>
  </g>

  <!-- Connective Cyber Circuit Bus -->
  <g filter="url(#soft-glow-sec)">
    <path d="M 770 340 H 870 L 920 280 H 1010" stroke="#34d399" stroke-width="4" fill="none" />
    <path d="M 770 450 H 870 L 920 520 H 1010" stroke="#06b6d4" stroke-width="4" fill="none" />
    <circle cx="870" cy="340" r="6" fill="#34d399" />
    <circle cx="870" cy="450" r="6" fill="#06b6d4" />
  </g>

  <!-- Right: Pentesting Toolkit & SOC SIEM Dashboard -->
  
  <!-- Block 1: Penetration Testing & Ethical Hacking -->
  <g transform="translate(1030, 160)" filter="url(#shadow-sec)">
    <rect width="420" height="230" rx="20" fill="url(#sec-card-surface)" stroke="#34d399" stroke-width="1.8" />
    
    <text x="25" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ecfdf5">Ethical Hacking &amp; Pentesting</text>
    <text x="25" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#6ee7b7">Kali Linux • Burp Suite • Metasploit Labs</text>

    <!-- Target Attack Surface Matrix -->
    <g transform="translate(25, 80)">
      <rect width="175" height="70" rx="10" fill="#022117" stroke="#10b981" stroke-width="1.2" />
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Packet Capture</text>
      <text x="15" y="52" font-family="monospace" font-size="16" font-weight="800" fill="#a7f3d0">Wireshark Live</text>

      <rect x="190" y="0" width="180" height="70" rx="10" fill="#022117" stroke="#06b6d4" stroke-width="1.2" />
      <text x="205" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#06b6d4">OWASP Top 10</text>
      <text x="205" y="52" font-family="monospace" font-size="16" font-weight="800" fill="#67e8f9">100% Mitigated</text>
    </g>

    <!-- Cert Pills -->
    <rect x="25" y="175" width="105" height="26" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-opacity="0.5" />
    <text x="37" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">CompTIA Sec+</text>

    <rect x="140" y="175" width="85" height="26" rx="6" fill="#083344" stroke="#06b6d4" stroke-width="1" />
    <text x="155" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#67e8f9">CEH v12</text>

    <rect x="235" y="175" width="90" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="250" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">CISSP Track</text>
  </g>

  <!-- Block 2: SIEM Enterprise Defense & Incident Response -->
  <g transform="translate(1030, 420)" filter="url(#shadow-sec)">
    <rect width="420" height="210" rx="20" fill="url(#sec-card-surface)" stroke="#06b6d4" stroke-width="1.8" />
    
    <text x="25" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ecfdf5">SOC SIEM &amp; Threat Defense</text>
    <text x="25" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#67e8f9">Splunk • Microsoft Sentinel • Incident Ops</text>

    <!-- SIEM Telemetry Console -->
    <g transform="translate(25, 80)">
      <rect width="370" height="65" rx="8" fill="#02140e" stroke="#047857" stroke-width="1" />
      <g font-family="monospace" font-size="11" font-weight="600">
        <text x="15" y="25" fill="#34d399">SOC Alert: Lateral movement probe blocked on 10.0.4.12</text>
        <text x="15" y="48" fill="#67e8f9">Zero-Trust Identity: Authenticated via FIDO2 Hardware Key</text>
      </g>
    </g>

    <!-- Tags Row -->
    <rect x="25" y="165" width="90" height="24" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#34d399" stroke-opacity="0.5" />
    <text x="37" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Splunk SIEM</text>

    <rect x="125" y="165" width="105" height="24" rx="6" fill="#083344" fill-opacity="0.3" stroke="#06b6d4" stroke-opacity="0.5" />
    <text x="137" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#67e8f9">SOC Analyst</text>

    <rect x="240" y="165" width="105" height="24" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-opacity="0.5" />
    <text x="252" y="181" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Zero-Trust</text>
  </g>

  <!-- Floating Cyber Badges -->
  <g transform="translate(680, 110)" filter="url(#shadow-sec)">
    <rect width="140" height="38" rx="10" fill="#06261b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#10b981" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff">AES-256 Bit</text>
  </g>

  <g transform="translate(860, 670)" filter="url(#shadow-sec)">
    <rect width="140" height="38" rx="10" fill="#06261b" stroke="#34d399" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#34d399" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#6ee7b7">Red &amp; Blue Team</text>
  </g>

  <g transform="translate(60, 660)" filter="url(#shadow-sec)">
    <rect width="190" height="42" rx="12" fill="#06261b" stroke="#34d399" stroke-width="1.5" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#34d399">🛡️ SOC Cyber Defense</text>
  </g>

  <!-- Glowing Corner Lights -->
  <circle cx="1500" cy="100" r="180" fill="#10b981" opacity="0.1" filter="url(#intense-glow-sec)" />
  <circle cx="100" cy="800" r="180" fill="#06b6d4" opacity="0.1" filter="url(#intense-glow-sec)" />
</svg>
